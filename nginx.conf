server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ficheiros em /assets/ têm nome com hash do conteúdo (gerado pelo Vite) — podem ser
    # cacheados pelo browser "para sempre", já que qualquer alteração muda o nome do ficheiro.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router (BrowserRouter) usa URLs limpos (ex: /formacoes) que não existem como
    # ficheiro no servidor — sem isto, actualizar a página numa rota dessas dava 404. Cai
    # sempre em "index.html" e deixa o React tratar do routing do lado do cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
