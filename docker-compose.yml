services:
  web:
    build: .
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s

# Sem "ports:" (publicação directa no host) de propósito — no Dokploy é o Traefik dele que
# recebe o tráfego externo e fala com o container pela rede interna; publicar também no host
# é desnecessário e pode colidir com outras apps no mesmo servidor.
#
# Para testar localmente (fora do Dokploy), este ficheiro não publica porta nenhuma no
# host de propósito — usar antes o Dockerfile directamente, escolhendo uma porta livre:
#   docker build -t cassfrei-website . && docker run --rm -p 8080:80 cassfrei-website
